{% extends "base.html" %}
{% block title %}Manufacturers{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">Manufacturer Management</h2>

<div class="card p-6 mb-8">
    <h3 class="text-xl font-semibold mb-4">Add/Edit Manufacturer</h3>
    <form id="manufacturerForm" class="space-y-4">
        <input type="hidden" id="manufacturerEditId">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 mb-2" for="companyId">Company ID</label>
                <input type="text" id="companyId" class="form-control" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="manufacturerName">Name</label>
                <input type="text" id="manufacturerName" class="form-control" required>
            </div>
            <div class="md:col-span-2">
                <label class="block text-gray-700 mb-2" for="manufacturerAddress">Address</label>
                <input type="text" id="manufacturerAddress" class="form-control" required>
            </div>
        </div>
        <button type="submit" class="btn add-btn">Save Manufacturer</button>
    </form>
</div>

<div class="card p-6 mb-8">
    <h3 class="text-xl font-semibold mb-4">Manufacturer Records</h3>
    <div class="overflow-x-auto">
        <table class="min-w-full">
            <thead>
                <tr>
                    <th>Company ID</th>
                    <th>Name</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="manufacturerTableBody">
                <!-- Table rows will be populated by JavaScript -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
