{% extends "base.html" %}
{% block title %}Doctors{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">Doctor Management</h2>
<div class="card p-6 mb-8">
    <h3 class="text-xl font-semibold mb-4">Add New Doctor</h3>
    <form id="doctorForm" class="space-y-4">
        <input type="hidden" id="doctorEditId">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 mb-2" for="doctorName">Doctor Name</label>
                <input type="text" id="doctorName" class="form-control" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="physicianId">Physician ID</label>
                <input type="text" id="physicianId" class="form-control" required>
            </div>
            <div class="md:col-span-2">
                <label class="block text-gray-700 mb-2" for="specialty">Specialty</label>
                <select id="specialty" class="form-control" required>
                    <option value="">Select Specialty</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Dermatology">Dermatology</option>
                    <option value="Endocrinology">Endocrinology</option>
                    <option value="Gastroenterology">Gastroenterology</option>
                    <option value="Neurology">Neurology</option>
                    <option value="Oncology">Oncology</option>
                    <option value="Pediatrics">Pediatrics</option>
                    <option value="Psychiatry">Psychiatry</option>
                    <option value="General Practice">General Practice</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn">Add Doctor</button>
    </form>
</div>

<div class="card p-6">
    <h3 class="text-xl font-semibold mb-4">Doctor Records</h3>
    <div class="overflow-x-auto">
        <table class="min-w-full">
            <thead>
                <tr>
                    <th>Physician ID</th>
                    <th>Doctor Name</th>
                    <th>Specialty</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="doctorTableBody">
                <!-- Table rows will be populated by JavaScript -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
