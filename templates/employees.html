{% extends "base.html" %}
{% block title %}Employees{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">Employee Management</h2>

<div class="card p-6 mb-8">
    <h3 class="text-xl font-semibold mb-4">Add/Edit Employee</h3>
    <form id="employeeForm" class="space-y-4">
        <input type="hidden" id="employeeEditId">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 mb-2" for="employeeId">Employee ID</label>
                <input type="text" id="employeeId" class="form-control" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="employeeName">Employee Name</label>
                <input type="text" id="employeeName" class="form-control" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="shiftStart">Shift Start</label>
                <input type="time" id="shiftStart" class="form-control" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="shiftEnd">Shift End</label>
                <input type="time" id="shiftEnd" class="form-control" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="employeePharmacy">Pharmacy</label>
                <select id="employeePharmacy" class="form-control" required>
                    <option value="">Select Pharmacy</option>
                    <!-- Options populated by JavaScript -->
                </select>
            </div>
        </div>
        <button type="submit" class="btn add-btn">Save Employee</button>
    </form>
</div>

<div class="card p-6">
    <h3 class="text-xl font-semibold mb-4">Employee Records</h3>
    <div class="overflow-x-auto">
        <table class="min-w-full">
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Pharmacy</th>
                    <th>Shift Start</th>
                    <th>Shift End</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                <!-- Table rows will be populated by JavaScript -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
