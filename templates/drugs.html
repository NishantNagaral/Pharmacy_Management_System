{% extends "base.html" %}
{% block title %}Drugs{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">Drug Management</h2>

<div class="card p-6 mb-8">
    <h3 class="text-xl font-semibold mb-4">Add/Edit Drug</h3>
    <form id="drugForm" class="space-y-4">
        <input type="hidden" id="drugEditId">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-gray-700 mb-2" for="tradeName">Trade Name</label>
                <input type="text" id="tradeName" class="form-control" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="drugPrice">Price</label>
                <input type="number" id="drugPrice" step="0.01" class="form-control" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="quantity">Quantity</label>
                <input type="number" id="quantity" class="form-control" required>
            </div>
            <div>
                <label class="block text-gray-700 mb-2" for="manufacturerId">Manufacturer</label>
                <select id="manufacturerId" class="form-control" required>
                    <option value="">Select Manufacturer</option>
                    <!-- Options populated by JavaScript -->
                </select>
            </div>
        </div>
        <button type="submit" class="btn add-btn">Save Drug</button>
    </form>
</div>

<div class="card p-6">
    <h3 class="text-xl font-semibold mb-4">Drug Inventory</h3>
    <div class="overflow-x-auto">
        <table class="min-w-full">
            <thead>
                <tr>
                    <th>Trade Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Manufacturer</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="drugTableBody">
                <!-- Table rows will be populated by JavaScript -->
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
